name: scio
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - jupyterlab
  - numpy
  - pandas
  - scipy
  - matplotlib
  - pyserial
  - bleak>=0.22        # Bluetooth LE transport (scio.ble); optional for USB-only use
  - cryptography
  - pytest
  - pip
# The `tp` conda env on this machine already satisfies these and is what the
# notebooks were developed against.
